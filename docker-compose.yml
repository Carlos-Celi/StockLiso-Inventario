version: '3.8'

services:
  firebase-emulator:
    build: .
    container_name: stockliso-emulator
    volumes:
      - .:/app
    ports:
      - "4000:4000" # Emulator UI
      - "5002:5002" # Hosting (HTTP)
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
      - "9199:9199" # Storage
    environment:
      - NODE_ENV=development
